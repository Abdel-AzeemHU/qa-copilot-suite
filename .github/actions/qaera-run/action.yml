name: "Qaera Run"
description: "Trigger a Qaera pipeline and wait for the result"
inputs:
  api-token:
    description: "Project API token (store as a secret)"
    required: true
  target-url:
    description: "URL to test"
    required: true
  api-base-url:
    description: "Qaera base URL"
    required: false
    default: "https://app.qaera.ai"
  visual:
    description: "Run visual regression"
    required: false
    default: "true"
  fail-on-regression:
    description: "Fail the job if the pipeline fails"
    required: false
    default: "true"
  timeout-seconds:
    description: "Max time to wait for completion"
    required: false
    default: "600"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: ${{ github.action_path }}/run.sh
      env:
        QAERA_TOKEN: ${{ inputs.api-token }}
        QAERA_TARGET_URL: ${{ inputs.target-url }}
        QAERA_BASE_URL: ${{ inputs.api-base-url }}
        QAERA_VISUAL: ${{ inputs.visual }}
        QAERA_FAIL: ${{ inputs.fail-on-regression }}
        QAERA_TIMEOUT: ${{ inputs.timeout-seconds }}
        QAERA_REF: ${{ github.ref }}
        QAERA_COMMIT: ${{ github.sha }}
        QAERA_PR_NUMBER: ${{ github.event.pull_request.number }}
