services:
  - type: web
    name: qaera
    env: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qaera-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: qaera-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

databases:
  - name: qaera-db
    databaseName: qaera
    plan: starter
